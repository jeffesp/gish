name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Check go.mod/go.sum are tidy
        # Safe on Windows now that .gitattributes pins LF checkouts
        # (autocrlf there used to produce CRLF copies, which made this
        # byte-compare flag every line of go.sum as changed).
        shell: bash
        run: go mod tidy -diff
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o gish-bin .
      - name: Test
        run: go test -race ./...
