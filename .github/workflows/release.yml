name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          suffix=""
          [ "$GOOS" = "windows" ] && suffix=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.Version=v${version}" \
            -o "dist/gish_${version}_${GOOS}_${GOARCH}${suffix}" .

      - name: Smoke test (native arch)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          out="$(./dist/gish_${version}_${GOOS}_${GOARCH} --version)"
          expected="gish v${version}"
          [ "$out" = "$expected" ] || { echo "unexpected: $out"; exit 1; }
          echo "$out"

      - name: Package
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          base="gish_${version}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "../${base}.zip" "${base}.exe")
          else
            (cd dist && tar czf "../${base}.tar.gz" "${base}")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        run: |
          cd dist
          # Flatten per-arch artifact folders, then checksum the artifacts.
          find . -mindepth 2 -maxdepth 2 -type f -exec mv {} . \;
          rm -rf */
          sha256sum * > ../SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
