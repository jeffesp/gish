name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke test version stamping
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.Version=v${version}" -o gish-smoke .
          out="$(./gish-smoke --version)"
          expected="gish v${version}"
          [ "$out" = "$expected" ] || { echo "unexpected: $out"; exit 1; }
          echo "$out"
          rm gish-smoke

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
