version: 2

project_name: gish

builds:
  - main: .
    binary: gish
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "gish_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS.txt
  algorithm: sha256

nfpms:
  - id: gish
    package_name: gish
    file_name_template: "gish_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    maintainer: Jeff Esp <jeff@todayisthursday.net>
    homepage: https://github.com/jeffesp/gish
    description: A Go-ish shell with JavaScript scripting.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gish/LICENSE
    scripts:
      postinstall: packaging/postinst.sh
      postremove: packaging/postrm.sh

changelog:
  disable: true

release:
  # Release notes are generated by GitHub.
  github:
    owner: jeffesp
    name: gish

homebrew_casks:
  - name: gish
    homepage: https://github.com/jeffesp/gish
    description: A Go-ish shell with JavaScript scripting.
    license: Apache-2.0
    repository:
      owner: jeffesp
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Jeff Esp
      email: jeff@todayisthursday.net
    # The binary is not signed or notarized; without this Gatekeeper blocks it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/gish"]
          end
    caveats: |
      To use gish as your login shell:
        echo "#{HOMEBREW_PREFIX}/bin/gish" | sudo tee -a /etc/shells
        chsh -s #{HOMEBREW_PREFIX}/bin/gish

scoops:
  - name: gish
    homepage: https://github.com/jeffesp/gish
    description: A Go-ish shell with JavaScript scripting.
    license: Apache-2.0
    repository:
      owner: jeffesp
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Jeff Esp
      email: jeff@todayisthursday.net
